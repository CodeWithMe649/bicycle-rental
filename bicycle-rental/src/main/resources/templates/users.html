<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::section}, 'users')}">
<body>
<section class="max-w-[1440px] mx-auto space-y-5">

    <!-- Flash Message -->
    <div th:if="${message}"
         class="bg-zinc-900 text-white border-l-4 border-emerald-400 px-4 py-3 rounded-r-lg text-xs font-medium flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-2.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span th:text="${message}">Action completed!</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-zinc-400 hover:text-white text-base leading-none">&times;</button>
    </div>

    <!-- Dark Command Header & Search Bar -->
    <div class="bg-zinc-900 text-white rounded-xl p-5 shadow-xs space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-zinc-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center text-amber-400">
                    <i data-lucide="users" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold tracking-tight text-white">User Directory</h2>
                        <span class="px-2 py-0.5 text-[10px] font-mono uppercase tracking-wider bg-zinc-800 text-amber-400 border border-zinc-700 rounded"
                              th:text="${users != null ? #lists.size(users) + ' Accounts' : '0 Accounts'}">0 Accounts</span>
                    </div>
                    <p class="text-xs text-zinc-400 mt-0.5">Manage registered riders, verified IDs, and station operators.</p>
                </div>
            </div>
        </div>

        <!-- Search & Role Filter Strip -->
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center">
            <input type="text" id="userSearch" onkeyup="filterUsers()" placeholder="Search user ID, name, or email..."
                   class="w-full sm:w-80 px-3.5 py-2 bg-zinc-950 border border-zinc-700 rounded-lg text-xs text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:border-amber-400">

            <div class="flex gap-1.5 w-full sm:w-auto bg-zinc-950 p-1 rounded-lg border border-zinc-800">
                <button type="button" onclick="setRoleFilter('ALL', this)"
                        class="role-btn px-3 py-1 rounded-md text-xs font-bold bg-amber-400 text-zinc-950 transition">All</button>
                <button type="button" onclick="setRoleFilter('ROLE_CUSTOMER', this)"
                        class="role-btn px-3 py-1 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">Riders</button>
                <button type="button" onclick="setRoleFilter('ROLE_ADMIN', this)"
                        class="role-btn px-3 py-1 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition">Admins</button>
            </div>
        </div>
    </div>

    <!-- Low-Glare Stone Table Container -->
    <div class="bg-stone-100 border border-stone-300/80 rounded-xl overflow-hidden shadow-xs">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-zinc-900 text-zinc-400 text-[11px] font-mono font-semibold uppercase tracking-wider border-b border-zinc-800">
                        <th class="py-3.5 px-5">User ID</th>
                        <th class="py-3.5 px-5">Full Name</th>
                        <th class="py-3.5 px-5">Email Address</th>
                        <th class="py-3.5 px-5">Access Role</th>
                        <th class="py-3.5 px-5 text-right">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-stone-200/90 text-xs">
                    <tr th:each="u : ${users}"
                        class="user-row hover:bg-stone-200/60 transition"
                        th:data-role="${u.role}">
                        <td class="py-3.5 px-5">
                            <span class="px-2.5 py-1 rounded bg-zinc-900 text-zinc-100 font-mono font-bold text-[11px]"
                                  th:text="${u.id}">USR001</span>
                        </td>
                        <td class="py-3.5 px-5 font-bold text-zinc-900 text-sm" th:text="${u.name}">Juan Dela Cruz</td>
                        <td class="py-3.5 px-5 font-mono text-stone-600" th:text="${u.email}">juan@email.com</td>
                        <td class="py-3.5 px-5">
                            <span th:text="${u.role}"
                                  th:classappend="${u.role == 'ROLE_ADMIN' ? 'bg-zinc-900 text-amber-400 border-zinc-700' : 'bg-stone-200 text-zinc-800 border-stone-300'}"
                                  class="px-2.5 py-0.5 rounded text-[10px] font-mono font-bold uppercase border">ROLE_CUSTOMER</span>
                        </td>
                        <td class="py-3.5 px-5 text-right">
                            <form th:if="${u.role != 'ROLE_ADMIN'}" th:action="@{/users/delete/{id}(id=${u.id})}" method="post" class="inline">
                                <button type="submit"
                                        onclick="return confirm('Delete this user account?')"
                                        title="Delete User"
                                        class="inline-flex items-center justify-center p-2 text-rose-700 bg-rose-500/10 hover:bg-rose-600 hover:text-white border border-rose-500/20 rounded-lg transition">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </form>
                            <span th:if="${u.role == 'ROLE_ADMIN'}"
                                  class="text-[10px] font-mono uppercase text-stone-400">Protected</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentRole = 'ALL';

        function setRoleFilter(role, btn) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(b => {
                b.className = 'role-btn px-3 py-1 rounded-md text-xs font-semibold text-zinc-400 hover:text-white transition';
            });
            btn.className = 'role-btn px-3 py-1 rounded-md text-xs font-bold bg-amber-400 text-zinc-950 transition';
            filterUsers();
        }

        function filterUsers() {
            const q = (document.getElementById('userSearch').value || '').toLowerCase();
            document.querySelectorAll('.user-row').forEach(row => {
                const text = row.innerText.toLowerCase();
                const role = row.dataset.role;
                const matchText = text.includes(q);
                const matchRole = currentRole === 'ALL' || role === currentRole;
                row.style.display = (matchText && matchRole) ? '' : 'none';
            });
        }
    </script>
</section>
</body>
</html>
