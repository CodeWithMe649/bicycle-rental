<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::section}, 'users')}">
<body>
<section>
    <div th:if="${message}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-medium" th:text="${message}"></div>

    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Manage Users</h2>
        <p class="text-gray-500">View registered customers and administrators.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100 text-xs uppercase text-gray-400 font-semibold">
                    <th class="py-4 px-6">User ID</th>
                    <th class="py-4 px-6">Name</th>
                    <th class="py-4 px-6">Email</th>
                    <th class="py-4 px-6">Role</th>
                    <th class="py-4 px-6 text-right">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
                <tr th:each="u : ${users}" class="hover:bg-gray-50 transition">
                    <td class="py-4 px-6 font-semibold text-gray-800" th:text="${u.id}">USR001</td>
                    <td class="py-4 px-6 text-gray-700" th:text="${u.name}">Juan Dela Cruz</td>
                    <td class="py-4 px-6 text-gray-500" th:text="${u.email}">juan@email.com</td>
                    <td class="py-4 px-6">
                        <span th:text="${u.role}"
                              th:classappend="${u.role == 'ROLE_ADMIN' ? 'bg-indigo-100 text-indigo-700' : 'bg-blue-100 text-blue-700'}"
                              class="px-3 py-1 rounded-full text-xs font-semibold">ROLE_CUSTOMER</span>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <form th:if="${u.role != 'ROLE_ADMIN'}" th:action="@{/users/delete/{id}(id=${u.id})}" method="post" class="inline">
                            <button type="submit" onclick="return confirm('Delete this user?')" class="p-2 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
