<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - BikeRent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-3xl shadow-xl flex overflow-hidden max-w-4xl w-full border border-gray-100">
        
        <!-- Left Banner: Matching Rental Store Bikes Background -->
        <div class="hidden md:flex w-1/2 bg-cover bg-center p-10 text-white flex-col justify-between relative overflow-hidden"
             style="background-image: linear-gradient(to bottom right, rgba(29, 78, 216, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=1000&auto=format&fit=crop');">
            
            <!-- Logo Top -->
            <div class="flex items-center gap-3 z-10">
                <div class="p-2 border-2 border-white rounded-full">
                    <i data-lucide="bike" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl">BikeRent</h1>
                    <p class="text-xs text-blue-200">Ride. Rent. Repeat.</p>
                </div>
            </div>

            <!-- Tagline Bottom -->
            <div class="z-10">
                <h2 class="text-3xl font-extrabold leading-tight">Create your account & start riding today!</h2>
            </div>
        </div>

        <!-- Right Registration Form Panel -->
        <div class="w-full md:w-1/2 p-10 flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-gray-900 mb-1 text-center">Create Account</h2>
            <p class="text-gray-400 text-xs text-center mb-6">Join BikeRent as a Customer</p>

            <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
                <div class="relative">
                    <i data-lucide="user" class="w-5 h-5 absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="text" th:field="*{name}" placeholder="Full Name" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="email" th:field="*{email}" placeholder="Email Address" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-blue-500">
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-3.5 text-gray-400"></i>
                    <input type="password" th:field="*{password}" placeholder="Password" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/30">
                    Register Now
                </button>
            </form>

            <!-- Back to Login Link -->
            <p class="text-xs text-center text-gray-500 mt-6">
                Already have an account? 
                <a th:href="@{/login}" class="text-blue-600 font-semibold hover:underline">Login</a>
            </p>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
