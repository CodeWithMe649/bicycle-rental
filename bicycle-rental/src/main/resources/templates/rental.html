<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::section}, 'rentals')}">
<body>
<section>
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">New Rental</h2>
        <p class="text-gray-500 text-sm">Rent a bicycle for your ride.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Bike Cards Grid -->
        <div class="lg:col-span-2">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Select Bicycle</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div th:each="bike, iter : ${bikes}" 
                     class="bg-white p-5 rounded-2xl border border-gray-200 hover:border-blue-500 cursor-pointer transition relative group">
                    <div class="h-28 flex items-center justify-center mb-3">
                        <i data-lucide="bike" class="w-20 h-20 text-gray-700"></i>
                    </div>
                    <h4 class="font-bold text-gray-800 text-sm" th:text="${bike.model}">Mountain Bike #001</h4>
                    <p class="text-blue-600 font-semibold text-sm" th:text="'₱' + ${bike.ratePerHour} + '/hour'">₱50 / hour</p>
                </div>
            </div>
        </div>

        <!-- Checkout Side Box -->
        <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm h-fit">
            <h3 class="font-bold text-gray-800 text-lg mb-6">Rental Details</h3>
            
            <form th:action="@{/rent-bike}" method="post">
                <input type="hidden" name="bikeId" value="BIK20260001">
                <div class="space-y-4 mb-6">
                    <div class="p-4 bg-gray-50 rounded-xl flex items-center gap-3">
                        <i data-lucide="bike" class="w-6 h-6 text-gray-600"></i>
                        <div>
                            <p class="text-xs text-gray-400 font-medium">Selected Bike</p>
                            <p class="font-semibold text-gray-800 text-sm">Mountain Bike #001</p>
                        </div>
                    </div>

                    <div class="p-4 bg-gray-50 rounded-xl flex items-center gap-3">
                        <i data-lucide="clock" class="w-6 h-6 text-gray-600"></i>
                        <div class="flex-1">
                            <p class="text-xs text-gray-400 font-medium">Duration</p>
                            <select class="w-full bg-transparent font-semibold text-gray-800 text-sm outline-none">
                                <option>2 Hours</option>
                                <option>4 Hours</option>
                                <option>Full Day</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-4 mb-6">
                    <p class="text-xs text-gray-400 font-medium">Total Price</p>
                    <h2 class="text-3xl font-extrabold text-blue-600">₱100</h2>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-4 h-4 fill-white"></i> Start Rental
                </button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
