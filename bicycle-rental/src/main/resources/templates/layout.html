<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, activeTab)">
<head>
    <meta charset="UTF-8">
    <title>BikeRent - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen flex text-gray-700">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0B1E3D] text-white flex flex-col justify-between shrink-0">
        <div>
            <!-- App Logo -->
            <div class="p-6 flex items-center gap-3">
                <div class="p-2 border border-white/20 rounded-full bg-blue-600/30">
                    <i data-lucide="bike" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">BikeRent</h1>
                    <p class="text-[10px] text-blue-300 tracking-wide mt-1">Ride. Rent. Repeat.</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="px-4 space-y-1 mt-4">
                <a th:href="@{/}" 
                   th:classappend="${activeTab == 'dashboard'} ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-white/5'" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>

                <!-- Admin-Only Sidebar Links -->
                <a th:if="${userRole == 'Administrator'}" th:href="@{/bicycles}" 
                   th:classappend="${activeTab == 'bicycles'} ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-white/5'" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition">
                    <i data-lucide="list" class="w-5 h-5"></i> Bicycles
                </a>

                <a th:if="${userRole == 'Administrator'}" th:href="@{/users}" 
                   th:classappend="${activeTab == 'users'} ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-white/5'" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition">
                    <i data-lucide="users" class="w-5 h-5"></i> Users
                </a>

                <a th:if="${userRole == 'Administrator'}" th:href="@{/transactions}" 
                   th:classappend="${activeTab == 'transactions'} ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-white/5'" 
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition">
                    <i data-lucide="receipt" class="w-5 h-5"></i> Transactions
                </a>
            </nav>
        </div>

        <!-- Logout Button -->
        <div class="p-4 border-t border-white/10">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-300 hover:bg-red-500/10 hover:text-red-400 transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Body -->
    <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
            <span class="text-sm font-semibold text-gray-500" th:text="'Role: ' + ${userRole}">Role</span>
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm"
                     th:text="${#strings.substring(username, 0, 1)}">C</div>
                <span class="font-bold text-sm text-gray-800" th:text="${username}">User</span>
            </div>
        </header>

        <!-- Main Page View -->
        <main class="p-8 flex-1 overflow-y-auto">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
