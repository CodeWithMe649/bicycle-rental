<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, activePage)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeRent — Station Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-200/80 text-zinc-900 min-h-screen flex antialiased">

    <!-- Mobile Backdrop Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()"
         class="fixed inset-0 bg-zinc-950/70 z-30 hidden lg:hidden"></div>

    <!-- Dark-Zinc Sticky Left Sidebar -->
    <aside id="sidebar"
           class="fixed inset-y-0 left-0 z-40 w-60 bg-zinc-950 text-zinc-100 border-r border-zinc-800 flex flex-col justify-between transform -translate-x-full transition-transform duration-200 ease-in-out lg:sticky lg:top-0 lg:h-screen lg:translate-x-0 shrink-0">
        <div>
            <!-- Brand Header with Bike Icon -->
            <div class="px-5 h-16 flex items-center justify-between border-b border-zinc-800/80">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-amber-400 text-zinc-950 flex items-center justify-center shrink-0">
                        <i data-lucide="bike" class="w-5 h-5 stroke-[2.5]"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm leading-tight tracking-tight text-white">BikeRent</h1>
                        <p class="text-[10px] font-mono uppercase tracking-wider text-zinc-400">Station OS</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="p-3.5 space-y-1 text-xs font-semibold">
                <p class="px-3 pt-1 pb-2 text-[10px] font-mono uppercase tracking-widest text-zinc-500">Operations</p>

                <a th:href="@{/dashboard}"
                   th:classappend="${activePage == 'dashboard'} ? 'bg-amber-400 text-zinc-950 font-bold shadow-xs' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg transition">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>

                <a th:href="@{/bicycles}"
                   th:classappend="${activePage == 'bicycles'} ? 'bg-amber-400 text-zinc-950 font-bold shadow-xs' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg transition">
                    <i data-lucide="bike" class="w-4 h-4"></i>
                    <span>Bicycles</span>
                </a>

                <a th:href="@{/users}"
                   th:classappend="${activePage == 'users'} ? 'bg-amber-400 text-zinc-950 font-bold shadow-xs' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg transition">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Users</span>
                </a>

                <a th:href="@{/transactions}"
                   th:classappend="${activePage == 'transactions'} ? 'bg-amber-400 text-zinc-950 font-bold shadow-xs' : 'text-zinc-400 hover:bg-zinc-900 hover:text-white'"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg transition">
                    <i data-lucide="receipt" class="w-4 h-4"></i>
                    <span>Transactions</span>
                </a>
            </nav>
        </div>

        <!-- Logout Footer -->
        <div class="p-3.5 border-t border-zinc-800/80">
            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-xs font-semibold text-zinc-400 hover:bg-rose-950/60 hover:text-rose-300 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span>Sign Out</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Dark-Zinc Top Header Bar -->
        <header class="bg-zinc-900 text-zinc-100 border-b border-zinc-800 px-4 sm:px-8 h-14 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-2 text-xs font-mono">
                    <span class="text-zinc-500 uppercase">Access:</span>
                    <span class="px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700 text-amber-400 font-semibold"
                          th:text="${userRole != null ? userRole : 'Admin'}">Admin</span>
                </div>
            </div>

            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-md bg-amber-400 text-zinc-950 font-mono font-bold text-xs flex items-center justify-center uppercase"
                     th:text="${username != null ? #strings.substring(username, 0, 1) : 'C'}">C</div>
                <span class="text-xs font-semibold text-zinc-200" th:text="${username != null ? username : 'Christian'}">Christian</span>
            </div>
        </header>

        <!-- Low-Glare Warm Stone Page Body -->
        <main class="p-4 sm:p-6 lg:p-8 flex-1">
            <div th:replace="${content}"></div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
