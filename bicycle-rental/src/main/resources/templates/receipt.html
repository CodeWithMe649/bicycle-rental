<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::section}, 'bicycles')}">
<body>
<section>
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Manage Bicycles</h2>
            <p class="text-gray-500 text-sm">Add, update, or remove bicycles.</p>
        </div>
        <button class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center gap-2 hover:bg-blue-700 transition">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Bike
        </button>
    </div>

    <!-- Table Card Container -->
    <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden shadow-sm">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 text-gray-400 text-xs font-semibold uppercase tracking-wider">
                    <th class="py-4 px-6">ID</th>
                    <th class="py-4 px-6">Name</th>
                    <th class="py-4 px-6">Type</th>
                    <th class="py-4 px-6">Price/Hour</th>
                    <th class="py-4 px-6">Status</th>
                    <th class="py-4 px-6 text-right">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
                <tr th:each="b : ${bikes}" class="hover:bg-gray-50/50">
                    <td class="py-4 px-6 font-semibold text-gray-700" th:text="${b.id}">001</td>
                    <td class="py-4 px-6 font-bold text-gray-900" th:text="${b.model}">Mountain Bike</td>
                    <td class="py-4 px-6 text-gray-500" th:text="${b.category}">Mountain</td>
                    <td class="py-4 px-6 font-semibold text-gray-800" th:text="'₱' + ${b.ratePerHour}">₱50</td>
                    <td class="py-4 px-6">
                        <span class="px-3 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-700" th:text="${b.status}">Available</span>
                    </td>
                    <td class="py-4 px-6 text-right space-x-2">
                        <button class="p-2 text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button class="p-2 text-red-600 bg-red-50 rounded-lg hover:bg-red-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
